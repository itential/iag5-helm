suite: Test serviceaccount.yaml template
templates:
  - serviceaccount.yaml
values:
  - ../tests/test-values.yaml
tests:
  - it: should not create a ServiceAccount when serviceAccount.create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a ServiceAccount when serviceAccount.create is true
    set:
      serviceAccount.create: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount

  - it: should use the chart fullname when serviceAccount.name is empty
    set:
      serviceAccount.create: true
      serviceAccount.name: ""
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-iag5

  - it: should use the provided name when serviceAccount.name is set
    set:
      serviceAccount.create: true
      serviceAccount.name: iag5-serviceaccount
    asserts:
      - equal:
          path: metadata.name
          value: iag5-serviceaccount

  - it: should include standard labels
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: serviceAccount

  - it: should include standard annotations
    set:
      serviceAccount.create: true
    asserts:
      - exists:
          path: metadata.annotations["itential.com/copyright"]
      - exists:
          path: metadata.annotations["itential.com/license"]
      - exists:
          path: metadata.annotations["helm.sh/template-file"]

  - it: should include IRSA annotation when set
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/IAG5-DynamoDB-Role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/IAG5-DynamoDB-Role

  - it: should set automountServiceAccountToken to false by default
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: should set automountServiceAccountToken to true when configured
    set:
      serviceAccount.create: true
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
